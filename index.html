<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Visor de QR</title>
</head>
<body>

<h2>Validación de persona</h2>

<select id="selector">
  <option value="">-- Seleccionar --</option>
</select>

<br><br>

<input type="text" id="dni_input" placeholder="Ingresar DNI" onkeyup="mostrarQR()">

<br><br>

<div id="info"></div>

<br>

<img id="qr" width="250" style="border:1px solid #ccc; display:none;">

<script>
let datos = [];

fetch('datos.csv')
  .then(response => response.text())
  .then(text => {

    let filas = text.trim().split(/\r?\n/);

    filas.slice(1).forEach(fila => {

      if(!fila.trim()) return;

      let columnas = fila.split(',');

      if(columnas.length < 5) return;

      let registro = {
        nombre: columnas[0].trim(),
        dni1: columnas[1].trim(),
        dni2: columnas[2].trim(),
        qr_url: columnas[4].trim()
      };

      datos.push(registro);

      let option = document.createElement("option");
      option.value = registro.nombre;
      option.text = registro.nombre;
      document.getElementById("selector").appendChild(option);

    });

  });

function mostrarQR(){

  let nombre = document.getElementById("selector").value;
  let dniIngresado = document.getElementById("dni_input").value.trim();

  let registro = datos.find(d => d.nombre === nombre);

  let info = document.getElementById("info");
  let img = document.getElementById("qr");

  if(!nombre){
    info.innerHTML = "Seleccione una persona";
    img.style.display = "none";
    return;
  }

  if(!dniIngresado){
    info.innerHTML = "Ingrese DNI";
    img.style.display = "none";
    return;
  }

  if(!registro){
    info.innerHTML = "No encontrado";
    img.style.display = "none";
    return;
  }

  let dniValido =
    (registro.dni1 && registro.dni1 === dniIngresado) ||
    (registro.dni2 && registro.dni2 === dniIngresado);

  if(dniValido){

    info.innerHTML =
      "<b>Nombre:</b> " + registro.nombre + "<br>" +
      "<b>DNI:</b> " + dniIngresado;

    img.src = registro.qr_url;
    img.style.display = "block";

  } else {

    info.innerHTML = "❌ DNI incorrecto";
    img.style.display = "none";

  }
}
</script>

</body>
</html>
